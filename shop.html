  <button onclick="filterCat('Food',this)">🍔 Food</button>

  <button onclick="filterCat('Beauty',this)">💄 Beauty</button>
</div>

<div class="banner">
  <b>🔥 Eldoret Flash Sale!</b>

  <button onclick="filterCat('Phones',document.querySelectorAll('#catTabs button')[1])">Shop Now →</button>

      <div style="display:flex;justify-content:space-between"><span>Total:</span><b id="cartTotal" style="color:#22c55e">KES 0</b></div>

<script>
let products = JSON.parse(localStorage.getItem('neurix_shop_products') || 'null') || [
  {id:1, name:"iPhone 13 - Like New", price:58000, old:72000, cat:"Phones", seller:"Kevin Kiprop", img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500", emoji:"📱"},
  {id:2, name:"Nike Air Force 1 - White", price:4500, old:6500, cat:"Fashion", seller:"Sarah", img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", emoji:"👟"},
  {id:3, name:"Samsung Galaxy A55", price:42000, old:49000, cat:"Phones", seller:"Eldoret Phones", img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500", emoji:"📱"},
  {id:4, name:"Smokie + Chips - Eldoret Best", price:250, old:350, cat:"Food", seller:"Mama Njoroge", img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500", emoji:"🍔"},
  {id:5, name:"HP Laptop ProBook", price:38500, old:45000, cat:"Electronics", seller:"Tech Hub Eldoret", img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500", emoji:"💻"},
  {id:6, name:"Glow Face Serum - Vitamin C", price:1200, old:1800, cat:"Beauty", seller:"Glow KE", img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500", emoji:"💄"},
];

let cart = JSON.parse(localStorage.getItem('neurix_cart') || '[]');
let currentCat = 'All';
let currentSearch = '';

function render(){
  let filtered = products.filter(p => (currentCat==='All' || p.cat===currentCat) && (p.name.toLowerCase().includes(currentSearch) || p.seller.toLowerCase().includes(currentSearch)));
  document.getElementById('productGrid').innerHTML = filtered.map(p => `
    <div class="card" onclick="viewProduct(${p.id})">
      <img src="${p.img}">
      <div class="info">
        <b>${p.emoji} ${p.name}</b>
        <small>by ${p.seller} • ⭐ 4.8</small>
        <div class="price">KES ${p.price.toLocaleString()} <span class="old">KES ${p.old.toLocaleString()}</span></div>
        <button onclick="event.stopPropagation(); addToCart(${p.id})">Add to Cart 🛒</button>
      </div>
    </div>
  `).join('');
  updateCartUI();
  localStorage.setItem('neurix_shop_products', JSON.stringify(products));
}
render();

function filterCat(c, btn){
  currentCat = c;
  document.querySelectorAll('#catTabs button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function filterProducts(){ currentSearch = document.getElementById('searchInput').value.toLowerCase(); render(); }

function viewProduct(id){
  let p = products.find(x=>x.id===id);
  if(confirm(p.name + '\n\nKES ' + p.price.toLocaleString() + '\nSeller: ' + p.seller + '\n\nAdd to cart?')) addToCart(id);
}

function addToCart(id){
  let p = products.find(x=>x.id===id);
  cart.push(p);
  localStorage.setItem('neurix_cart', JSON.stringify(cart));
  updateCartUI();
  alert('Added to cart! ' + p.name + ' 🛒');
}

function updateCartUI(){
  document.getElementById('cartCount').innerText = cart.length;
  let total = cart.reduce((sum,p)=>sum+p.price,0);
  document.getElementById('cartTotal').innerText = 'KES ' + total.toLocaleString();
  document.getElementById('cartItems').innerHTML = cart.length===0 ? '<p style="text-align:center;color:#888">Cart is empty bro. Add something! 🛒</p>' : cart.map((p,i)=>`
    <div class="cart-item">
      <img src="${p.img}">
      <div><b>${p.name}</b><br><small style="color:#22c55e">KES ${p.price.toLocaleString()}</small></div>
      <button onclick="removeFromCart(${i})">✕</button>
    </div>
  `).join('');
}

function removeFromCart(i){ cart.splice(i,1); localStorage.setItem('neurix_cart', JSON.stringify(cart)); updateCartUI(); }

function openCart(){ document.getElementById('cartDrawer').style.display='flex'; updateCartUI(); }
function closeCart(){ document.getElementById('cartDrawer').style.display='none'; }

function sellProduct(){
  let name = prompt('What are you selling bro? (e.g. iPhone 12)');
  if(!name) return;
  let price = prompt('Price in KES? (e.g. 30000)');
  if(!price) return;
  let cat = prompt('Category? Phones / Fashion / Food / Electronics / Beauty', 'Phones');
  let newP = {id: Date.now(), name:name, price: parseInt(price)||0, old: (parseInt(price)||0)+5000, cat: cat||'Phones', seller:"You", img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", emoji:"🛍️"};
  products.unshift(newP);
  localStorage.setItem('neurix_shop_products', JSON.stringify(products));
  render();
  alert('Your product is LIVE! 🔥 People can now buy it.');
}

function checkoutMpesa(){
  if(cart.length===0) return alert('Cart is empty bro!');
  let total = cart.reduce((s,p)=>s+p.price,0);
  let phone = prompt('Enter M-Pesa number (e.g. 0712345678):');
  if(!phone) return;
  alert('💚 M-Pesa STK Push sent to ' + phone + '\nAmount: KES ' + total.toLocaleString() + '\n\nEnter PIN to complete (Demo). Order placed! 🎉');
  cart = []; localStorage.setItem('neurix_cart', JSON.stringify(cart)); updateCartUI(); closeCart();
}

function checkoutChat(){
  if(cart.length===0) return alert('Cart is empty!');
  location.href = 'chat.html?id=sarah';
}
</script>
