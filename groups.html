<div class="top">

  <button onclick="filterCat('Hustle',this)">💼 Hustle</button>
  <button onclick="filterCat('Gaming',this)">🎮 Gaming</button>
  <button onclick="filterCat('Music',this)">🎵 Music</button>
  <button onclick="filterCat('Tech',this)">🧠 Tech</button>
  <button onclick="filterCat('Eldoret',this)">🇰🇪 Eldoret</button>
</div>

<div style="padding:0 14px 10px;display:flex;justify-content:space-between;align-items:center">
  <h3 style="margin:0;font-size:15px">🔥 Discover Groups</h3>
  <small style="color:#888" id="groupCount">6 groups</small>
</div>

<div id="groupList"></div>

<button class="create-btn" onclick="createGroup()">+ Create Group</button>

<!-- GROUP CHAT VIEW -->
<div class="chat-view" id="chatView">
  <div class="chat-header">
    <button onclick="closeChat()">←</button>
    <div id="chatIcon" style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:22px">🔥</div>
    <div style="flex:1"><b id="chatName">Group</b><br><small id="chatMembers" style="color:#22c55e">12 members • 3 online</small></div>
    <button onclick="alert('Group info: Members, rules, invite link')">ℹ️</button>

  <div class="msgs" id="msgs"></div>
  <div class="input">

    <button onclick="sendMsg()">➤</button>

  <div onclick="location.href='profile.html'"><span>👤</span>You</div>
</div>

<script>
let groups = JSON.parse(localStorage.getItem('neurix_groups') || 'null') || [
  {id:1, name:"Eldoret Hustlers 💼", emoji:"💼", cat:"Hustle", desc:"Jobs, business, money moves in Eldoret. Post hustle, find hustle.", members:"12.4K", posts:"1.2K posts/day", joined:false},
  {id:2, name:"NEURIX Squad 🔥", emoji:"🧠", cat:"Tech", desc:"Official NEURIX group. Updates, ideas, early features.", members:"8.2K", posts:"856 posts/day", joined:true},
  {id:3, name:"Kenya Gamers 🎮", emoji:"🎮", cat:"Gaming", desc:"Free Fire, PUBG, FIFA tournaments. Win cash prizes!", members:"23.1K", posts:"2.1K posts/day", joined:false},
  {id:4, name:"Gengetone & Amapiano 🎵", emoji:"🎵", cat:"Music", desc:"New music, freestyles, beats. Post your song!", members:"18.7K", posts:"1.8K posts/day", joined:false},
  {id:5, name:"Eldoret Food Lovers 🍔", emoji:"🍔", cat:"Eldoret", desc:"Best food spots in Eldoret. Smokie, chips, nyama choma reviews.", members:"9.5K", posts:"432 posts/day", joined:false},
  {id:6, name:"Learn Coding in Kenya 💻", emoji:"💻", cat:"Tech", desc:"Learn HTML, Python, AI. Free lessons daily. Beginners welcome!", members:"15.3K", posts:"987 posts/day", joined:true},
];

let currentGroup = null;
let groupChats = {};
let currentCat = 'All';
let currentSearch = '';

function render(){
  let filtered = groups.filter(g => (currentCat==='All' || g.cat===currentCat) && (g.name.toLowerCase().includes(currentSearch) || g.desc.toLowerCase().includes(currentSearch)));
  document.getElementById('groupCount').innerText = filtered.length + ' groups';
  document.getElementById('groupList').innerHTML = filtered.map(g => `
    <div class="group-card">
      <div class="icon">${g.emoji}</div>
      <div class="info" onclick="openGroup(${g.id})">
        <b>${g.name}</b>
        <p>${g.desc}</p>
        <div class="meta">👥 ${g.members} members • ${g.posts} • ${g.cat}</div>
      </div>
      <button class="join-btn ${g.joined?'joined':''}" onclick="toggleJoin(${g.id}, this)">${g.joined?'✓ Joined':'Join'}</button>
    </div>
  `).join('');
  localStorage.setItem('neurix_groups', JSON.stringify(groups));
}
render();

function filterCat(c, btn){
  currentCat = c;
  document.querySelectorAll('#catTabs button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function filterGroups(){ currentSearch = document.getElementById('searchInput').value.toLowerCase(); render(); }

function toggleJoin(id, btn){
  let g = groups.find(x=>x.id===id);
  g.joined = !g.joined;
  if(g.joined) alert('Joined ' + g.name + '! 🔥 Welcome bro!');
  render();
  if(g.joined) openGroup(id);
}

function createGroup(){
  let name = prompt('Group name bro? (e.g. Eldoret Riders)');
  if(!name) return;
  let cat = prompt('Category? Hustle / Gaming / Music / Tech / Eldoret', 'Hustle');
  let desc = prompt('What is group about?') || 'New NEURIX group 🔥';
  let newG = {id: Date.now(), name:name, emoji:"👥", cat:cat||'Hustle', desc:desc, members:"1", posts:"Just created", joined:true};
  groups.unshift(newG);
  render();
  alert('Group created! ' + name + ' is LIVE 🔥');
  openGroup(newG.id);
}

function openGroup(id){
  let g = groups.find(x=>x.id===id);
  if(!g.joined){
    if(!confirm('Join ' + g.name + ' to chat?')) return;
    g.joined = true; render();
  }
  currentGroup = g;
  document.getElementById('chatName').innerText = g.name;
  document.getElementById('chatIcon').innerText = g.emoji;
  document.getElementById('chatMembers').innerText = g.members + ' members • 3 online';
  document.getElementById('chatView').style.display = 'flex';
  document.querySelector('.nav').style.display = 'none';
  if(!groupChats[id]){
    groupChats[id] = [
      {user:"Sarah", t:"Welcome to " + g.name + "! 🔥"},
      {user:"Kevin", t:"Yo bro, finally joined!"},
      {user:"Admin", t:"Rules: No spam, respect everyone, post value 🧠✦"}
    ];
  }
  renderMsgs();
}

function renderMsgs(){
  let msgs = groupChats[currentGroup.id] || [];
  document.getElementById('msgs').innerHTML = msgs.map(m => `<div class="msg ${m.user==='You' ? 'me' : ''}"><b>${m.user}</b>${m.t}</div>`).join('');
  setTimeout(()=>{ let el=document.getElementById('msgs'); el.scrollTop = el.scrollHeight; },50);
}

function closeChat(){
  document.getElementById('chatView').style.display = 'none';
  document.querySelector('.nav').style.display = 'flex';
  render();
}

function sendMsg(){
  let inp = document.getElementById('inp');
  let v = inp.value.trim(); if(!v) return;
  groupChats[currentGroup.id].push({user:"You", t:v});
  inp.value=''; renderMsgs();
  setTimeout(()=>{
    let users = ["Sarah","Kevin","Brian","Faith"];
    let replies = ["🔥 True bro!", "Waaa that's fire!", "Send link!", "I agree 100%", "NEURIX to the world 🌍", "Haha 😂"];
    let u = users[Math.floor(Math.random()*users.length)];
    let r = replies[Math.floor(Math.random()*replies.length)];
    groupChats[currentGroup.id].push({user:u, t:r});
    renderMsgs();
  }, 900);
}

document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(); });
</script>
</body>
</html>
