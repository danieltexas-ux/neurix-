    <div class="hl" onclick="location.href='profile.html'"><div>🔥</div><small>My Day</small></div>

<script>
let stories = JSON.parse(localStorage.getItem('neurix_stories') || 'null') || [
  {name:"You", emoji:"🧠", img:"", time:"Your Story"},
  {name:"Sarah", emoji:"👩", img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500", time:"2h ago"},
  {name:"Kevin", emoji:"👨", img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500", time:"4h ago"},
  {name:"NEURIX", emoji:"✦", img:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=500", time:"6h ago"}
];

let currentIndex = 0;
let timer = null;

function render(){
  document.getElementById('stories').innerHTML = stories.map((s,i)=>`
    <div class="story ${s.name==='You' ? 'you' : ''}" onclick="viewStory(${i})">
      ${s.img ? `<img src="${s.img}">` : `<div style="position:absolute;inset:0;background:linear-gradient(135deg,#a855f7,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:60px">${s.emoji}</div>`}
      <div class="overlay"></div>
      <div class="avatar">${s.emoji}</div>
      <div class="info"><b>${s.name}</b><small>${s.time}</small></div>
    </div>
  `).join('');
  localStorage.setItem('neurix_stories', JSON.stringify(stories));
}
render();

function addStory(e){
  let f = e.target.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = function(){
    stories.unshift({name:"You", emoji:"🧠", img:r.result, time:"Just now"});
    render();
    alert('Story posted! 🔥');
  };
  r.readAsDataURL(f);
}

function viewStory(i){
  let s = stories[i];
  if(!s.img){ alert('No photo in this story yet. Add one!'); return; }
  currentIndex = i;
  document.getElementById('viewAvatar').innerText = s.emoji;
  document.getElementById('viewName').innerText = s.name;
  document.getElementById('viewImg').src = s.img;
  document.getElementById('viewer').style.display = 'flex';
  startProgress();
}

function startProgress(){
  let bar = document.getElementById('bar');
  let w = 0;
  clearInterval(timer);
  timer = setInterval(()=>{
    w += 2; bar.style.width = w + '%';
    if(w >= 100){
      clearInterval(timer);
      nextStory();
    }
  }, 60);
}

function nextStory(){
  if(currentIndex + 1 < stories.length && stories[currentIndex+1].img){
    viewStory(currentIndex+1);
  } else {
    closeViewer();
  }
}

function closeViewer(){
  clearInterval(timer);
  document.getElementById('viewer').style.display = 'none';
}

function replyStory(){
  let v = document.getElementById('replyInput').value.trim();
  if(v){
    alert('Reply sent to ' + stories[currentIndex].name + ': ' + v + ' ❤️');
    document.getElementById('replyInput').value = '';
  } else {
    alert('❤️ Liked ' + stories[currentIndex].name + '\'s story!');
  }
}

// Tap left/right to go prev/next
document.getElementById('viewImg').addEventListener('click', (e)=>{
  if(e.clientX < window.innerWidth/2){
    if(currentIndex > 0) viewStory(currentIndex-1);
  } else {
    nextStory();
  }
});
</script>
</body>
</html>
