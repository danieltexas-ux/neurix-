<script>
let jobs = JSON.parse(localStorage.getItem('neurix_jobs') || 'null') || [
  {id:1, title:"Delivery Rider - Eldoret Town", company:"NEURIX Delivery", emoji:"🛵", location:"Eldoret Town", type:"Gig", pay:"KES 800 / day", desc:"Deliver food & parcels in Eldoret. Own bike + phone. Paid daily via M-Pesa.", tags:["Daily Pay","No CV Needed"], hot:true},
  {id:2, title:"Waiter / Waitress - Cafe", company:"Mama Njoroge Cafe", emoji:"☕", location:"Eldoret, Zion Mall", type:"Part-time", pay:"KES 12,000 / month", desc:"Serve customers, clean tables. Experience not needed. Friendly + fast learner.", tags:["Meals Included"], hot:false},
  {id:3, title:"Video Editor - TikTok / Reels", company:"NEURIX Creators", emoji:"🎬", location:"Remote", type:"Remote", pay:"KES 500 / video", desc:"Edit Reels for creators. CapCut / NEURIX Editor. Portfolio = your TikTok.", tags:["Remote","Creative"], hot:true},
  {id:4, title:"Shop Attendant - Phone Shop", company:"Eldoret Phones", emoji:"📱", location:"Eldoret, Oginga Odinga St", type:"Full-time", pay:"KES 18,000 / month", desc:"Sell phones, help customers, manage stock. Know phones = big advantage.", tags:["Full-time"], hot:false},
  {id:5, title:"Graphic Designer - Posters", company:"Glow KE", emoji:"🎨", location:"Remote", type:"Remote", pay:"KES 1,000 / design", desc:"Design posters for shops in Eldoret. Canva / Photoshop. Send 3 samples.", tags:["Remote","Flexible"], hot:false},
  {id:6, title:"Boda Boda Rider - Weekend", company:"Eldoret Riders", emoji:"🏍️", location:"Eldoret", type:"Gig", pay:"KES 1,200 / day", desc:"Weekend rider. Licence + bike needed. Fuel provided. Start this Saturday.", tags:["Weekend","Daily Pay"], hot:true},
  {id:7, title:"AI Content Creator", company:"NEURIX AI", emoji:"🧠", location:"Remote", type:"Part-time", pay:"KES 15,000 / month", desc:"Use NEURIX AI to make content for brands. No experience, we train you.", tags:["AI","Training"], hot:true},
  {id:8, title:"Sales Agent - M-Pesa / Airtime", company:"Safaricom Agent", emoji:"💚", location:"Eldoret Town", type:"Full-time", pay:"KES 20,000 + Commission", desc:"Sell lines, register M-Pesa. Commission on every sale. Target = bonus.", tags:["Commission"], hot:false},
];

let applied = JSON.parse(localStorage.getItem('neurix_applied_jobs') || '[]');
let currentCat = 'All';
let currentSearch = '';

function render(){
  let filtered = jobs.filter(j => (currentCat==='All' || j.type===currentCat) && (j.title.toLowerCase().includes(currentSearch) || j.company.toLowerCase().includes(currentSearch) || j.location.toLowerCase().includes(currentSearch)));
  document.getElementById('jobList').innerHTML = filtered.map(j => {
    let isApplied = applied.includes(j.id);
    return `
    <div class="job-card" onclick="viewJob(${j.id})">
      <div class="job-head">
        <div class="logo">${j.emoji}</div>
        <div><b>${j.title} ${j.hot ? '🔥' : ''}</b><small>${j.company} • 📍 ${j.location}</small></div>
      </div>
      <p style="font-size:13px;color:#aaa;line-height:1.4;margin:10px 0 0">${j.desc}</p>
      <div class="tags"><span class="tag">${j.type}</span>${j.tags.map(t=>`<span class="tag ${t.includes('Pay') ? 'green' : ''}">${t}</span>`).join('')}</div>
      <div class="job-foot">
        <span class="pay">${j.pay}</span>
        <button class="apply-btn ${isApplied?'applied':''}" onclick="event.stopPropagation(); applyJob(${j.id})">${isApplied?'✓ Applied':'Apply Now'}</button>
      </div>
    </div>
    `;
  }).join('');
  // My applications
  let my = jobs.filter(j=>applied.includes(j.id));
  if(my.length>0){
    document.getElementById('myJobsBox').style.display='block';
    document.getElementById('appliedCount').innerText = my.length;
    document.getElementById('myJobsList').innerHTML = my.map(j=>`• ${j.title} - <b style="color:#22c55e">Pending Review</b> <button onclick="withdraw(${j.id})" style="background:none;border:none;color:#ff3040;cursor:pointer">Withdraw</button>`).join('<br>');
  } else {
    document.getElementById('myJobsBox').style.display='none';
  }
  localStorage.setItem('neurix_jobs', JSON.stringify(jobs));
}
render();

function filterCat(c, btn){
  currentCat = c;
  document.querySelectorAll('#catTabs button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function filterJobs(){ currentSearch = document.getElementById('searchInput').value.toLowerCase(); render(); }

function viewJob(id){
  let j = jobs.find(x=>x.id===id);
  if(confirm(j.title + '\n\n' + j.company + ' • ' + j.location + '\nPay: ' + j.pay + '\n\n' + j.desc + '\n\nApply for this job?')) applyJob(id);
}

function applyJob(id){
  if(applied.includes(id)) return alert('Already applied bro! Check My Applications above.');
  let name = prompt('Your name?') || 'Bro';
  let phone = prompt('M-Pesa / WhatsApp number? (e.g. 0712345678)') || '';
  let exp = prompt('Any experience? (type No if none)') || 'No';
  applied.push(id);
  localStorage.setItem('neurix_applied_jobs', JSON.stringify(applied));
  render();
  alert('✅ Applied! ' + name + '\n\n' + jobs.find(j=>j.id===id).company + ' will contact you on ' + phone + ' soon.\nGood luck bro! 💪');
}

function withdraw(id){
  applied = applied.filter(x=>x!==id);
  localStorage.setItem('neurix_applied_jobs', JSON.stringify(applied));
  render();
}

function postJob(){
  let title = prompt('Job title? (e.g. Need Cleaner)');
  if(!title) return;
  let pay = prompt('Pay? (e.g. KES 500 / day)') || 'KES 500 / day';
  let loc = prompt('Location?') || 'Eldoret';
  let type = prompt('Type? Full-time / Part-time / Gig / Remote', 'Gig') || 'Gig';
  let desc = prompt('Describe the job?') || 'New hustle in Eldoret 🔥';
  let newJ = {id: Date.now(), title:title, company:"You", emoji:"💼", location:loc, type:type, pay:pay, desc:desc, tags:["Your Post"], hot:true};
  jobs.unshift(newJ);
  localStorage.setItem('neurix_jobs', JSON.stringify(jobs));
  render();
  alert('Your job is LIVE! 🔥 People in Eldoret can now apply.');
}
</script>
