body{margin:0;background:#000;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}

  <div style="display:flex;gap:8px;align-items:center">

<div class="live-area" id="liveArea">
  <video id="cam" autoplay playsinline muted style="display:none"></video>
  <div class="overlay"></div>

  <div class="center" id="startScreen">
    <div class="avatar">🧠</div>
    <h2 style="margin:12px 0 4px">Go Live on NEURIX</h2>
    <p style="color:#aaa;font-size:14px;margin:0">Talk to your fans • Sell • Get gifts</p>
    <input id="liveTitle" placeholder="Live title... e.g. Selling iPhones in Eldoret 🔥" style="margin-top:14px;width:100%;max-width:300px;padding:12px;border-radius:20px;border:none;background:#262626;color:#fff;outline:none">

</div>

<script>
let isLive = false;
let viewers = 0;
let viewerTimer = null;
let commentTimer = null;
let gifts = 0;
let coins = 0;

let fakeUsers = [
  {name:"Sarah", emoji:"👩"}, {name:"Kevin", emoji:"👨"}, {name:"Mama", emoji:"👩‍🦳"},
  {name:"Brian", emoji:"🧑"}, {name:"Faith", emoji:"👧"}, {name:"David", emoji:"👦"}
];
let fakeComments = [
  "Bro this is fire 🔥", "NEURIX to the world 🌍", "Send link!", "You built this??",
  "Eldoret stand up! 🇰🇪", "Waaa 🔥🔥", "How much is iPhone?", "I want that hoodie!",
  "Follow back bro!", "This app is crazy!", "Live from Eldoret!", "Gift incoming 🎁"
];

async function goLive(){
  let title = document.getElementById('liveTitle').value || 'Live on NEURIX 🔥';
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('liveBadge').style.display = 'flex';
  document.getElementById('rightActions').style.display = 'flex';
  document.getElementById('bottomBar').style.display = 'flex';
  document.getElementById('shopPopup').style.display = 'flex';
  isLive = true;
  viewers = 12;
  updateViewers();
  addComment("System", "🎉 You are LIVE! Title: " + title);

  // Try camera
  try{
    let stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    let v = document.getElementById('cam');
    v.style.display = 'block';
    v.srcObject = stream;
  }catch(e){
    // No camera - keep gradient background, still works
    console.log("Camera not allowed, using avatar mode");
  }

  // Viewers grow
  viewerTimer = setInterval(()=>{
    viewers += Math.floor(Math.random()*5);
    updateViewers();
  }, 3000);

  // Auto fake comments
  commentTimer = setInterval(()=>{
    let u = fakeUsers[Math.floor(Math.random()*fakeUsers.length)];
    let c = fakeComments[Math.floor(Math.random()*fakeComments.length)];
    addComment(u.name, c);
    if(Math.random() > 0.7) sendGift('❤️', true);
  }, 4000);
}

function watchLive(){
  document.getElementById('startScreen').innerHTML = `
    <div style="display:flex;gap:10px;overflow-x:auto;justify-content:center">
      <div onclick="joinLive('Sarah')" style="background:#111;padding:14px;border-radius:16px;cursor:pointer;min-width:120px"><div style="font-size:40px">👩</div><b>Sarah</b><br><small style="color:#ff3040">● LIVE • 1.2K</small><br><small>Singing 🎤</small></div>
      <div onclick="joinLive('Kevin')" style="background:#111;padding:14px;border-radius:16px;cursor:pointer;min-width:120px"><div style="font-size:40px">👨</div><b>Kevin</b><br><small style="color:#ff3040">● LIVE • 890</small><br><small>Selling phones 📱</small></div>
    </div>
    <p style="color:#aaa;font-size:13px">Tap a live to join</p>
    <button onclick="location.reload()" style="background:#262626;border:none;color:#fff;padding:10px 20px;border-radius:20px;cursor:pointer">Back</button>
  `;
}

function joinLive(name){
  alert('Joined ' + name + '\'s live! Say hi in comments 👋');
  goLive();
  document.getElementById('liveBadge').innerText = '● LIVE • ' + name;
}

function updateViewers(){
  document.getElementById('viewerCount').innerText = '👁️ ' + viewers.toLocaleString() + ' watching • 💎 ' + coins;
}

function addComment(name, text){
  let div = document.createElement('div');
  div.className = 'comment';
  div.innerHTML = `<b>${name}</b> ${text}`;
  document.getElementById('comments').appendChild(div);
  // Keep only last 6
  let all = document.getElementById('comments').children;
  if(all.length > 6) all[0].remove();
}

function sendComment(){
  let inp = document.getElementById('commentInput');
  let v = inp.value.trim(); if(!v) return;
  addComment('You', v);
  inp.value = '';
  setTimeout(()=>{
    let u = fakeUsers[Math.floor(Math.random()*fakeUsers.length)];
    addComment(u.name, '🔥 ' + v.slice(0,20));
  }, 1200);
}

function sendGift(emoji, auto=false){
  gifts++; coins += 10;
  updateViewers();
  let f = document.createElement('div');
  f.className = 'gift-float';
  f.innerText = emoji;
  document.getElementById('liveArea').appendChild(f);
  setTimeout(()=>f.remove(), 2000);
  if(!auto) addComment('You', 'Sent ' + emoji + ' gift! 🎁 +10 coins');
}

function shareLive(){
  alert('Live link copied! https://neurix.app/live/bro 🔥 Share it!');
}

function endLive(){
  if(!confirm('End live? Viewers: ' + viewers + ' • Gifts: ' + gifts + ' • Coins: ' + coins)) return;
  clearInterval(viewerTimer);
  clearInterval(commentTimer);
  alert('Live ended! 🎉\n\nStats:\n👁️ ' + viewers + ' viewers\n🎁 ' + gifts + ' gifts\n💎 ' + coins + ' coins earned\n\nGreat live bro!');
  location.reload();
}

document.getElementById('commentInput')?.addEventListener('keydown', e => { if(e.key==='Enter') sendComment(); });
</script>
</body>
